[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latticelm"
version = "0.1.0"
description = "CPU-first conditional-memory language model experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "psutil>=5.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
